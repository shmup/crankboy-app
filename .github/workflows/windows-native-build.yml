# ABOUTME: Windows native CI build workflow for CrankBoy simulator using Visual Studio Build Tools
# ABOUTME: Alternative approach using Windows native toolchain instead of MSYS2

name: Windows Native Simulator Build

on:
    # Triggers the workflow on push or pull request events
    push:
        branches: [development, main]
    pull_request:
        branches: [development, main]

    # Allows you to run this workflow manually from the Actions tab on GitHub.
    workflow_dispatch:

jobs:
    build_simulator_windows_native:
        name: Create Windows Simulator Build (Native)
        runs-on: windows-latest
        steps:
            # Step 1: Check out the repository's code, submodules, and LFS files.
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  lfs: true

            # Step 2: Setup Visual Studio Build Tools
            - name: Setup Visual Studio Build Tools
              uses: microsoft/setup-msbuild@v2

            # Step 3: Setup MSVC environment
            - name: Setup MSVC Environment
              uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: x64

            # Step 4: Download and Setup Playdate SDK for Windows
            - name: Download and Setup Playdate SDK
              shell: powershell
              run: |
                  # Download Playdate SDK 2.7.6 for Windows
                  Write-Host "Downloading Playdate SDK for Windows..."
                  Invoke-WebRequest -Uri "https://download.panic.com/playdate_sdk/Windows/PlaydateSDK-2.7.6.exe" -OutFile "PlaydateSDK-2.7.6.exe"
                  
                  # Install SDK silently
                  Write-Host "Installing Playdate SDK..."
                  Start-Process -FilePath ".\PlaydateSDK-2.7.6.exe" -ArgumentList "/S" -Wait
                  
                  # The SDK typically installs to Documents\PlaydateSDK
                  $SDKPath = "$env:USERPROFILE\Documents\PlaydateSDK"
                  if (Test-Path $SDKPath) {
                      Write-Host "SDK found at: $SDKPath"
                      echo "PLAYDATE_SDK_PATH=$SDKPath" >> $env:GITHUB_ENV
                  } else {
                      # Try alternative common locations
                      $AltPath = "C:\PlaydateSDK"
                      if (Test-Path $AltPath) {
                          Write-Host "SDK found at: $AltPath"
                          echo "PLAYDATE_SDK_PATH=$AltPath" >> $env:GITHUB_ENV
                      } else {
                          Write-Error "PlaydateSDK not found in expected locations"
                          Get-ChildItem -Path $env:USERPROFILE -Directory -Name "*Playdate*" -Recurse -ErrorAction SilentlyContinue
                          exit 1
                      }
                  }

            # Step 5: Prepare Lua scripts
            - name: Prepare Lua Scripts
              shell: powershell
              run: |
                  New-Item -ItemType Directory -Force -Path "Source\scripts"
                  Get-ChildItem -Path "src\scripts\*.lua" | ForEach-Object {
                      $baseName = $_.BaseName
                      Copy-Item $_.FullName "Source\scripts\$baseName.l"
                  }

            # Step 6: Update Version and Build Number in pdxinfo
            - name: Update Version and Build Number
              shell: powershell
              run: |
                  $dateStamp = Get-Date -Format "yyyyMMdd"
                  $content = Get-Content "Source\pdxinfo"
                  $currentVersion = ($content | Where-Object { $_ -match "^version=" }) -replace "^version=", ""
                  $newVersion = "$currentVersion.$dateStamp"
                  
                  $content = $content -replace "^version=.*", "version=$newVersion"
                  $content = $content -replace "^buildNumber=.*", "buildNumber=$dateStamp"
                  
                  $content | Set-Content "Source\pdxinfo"
                  Write-Host "Updated version to: $newVersion"
                  Get-Content "Source\pdxinfo"

            # Step 7: Build using PDC (Playdate Compiler)
            - name: Build Simulator Project using PDC
              shell: cmd
              run: |
                  echo Building CrankBoy for Windows Simulator...
                  "%PLAYDATE_SDK_PATH%\bin\pdc" Source CrankBoy.pdx

            # Step 8: Get Windows Simulator Artifact Name
            - name: Get Windows Simulator Artifact Name
              id: artifact_details
              shell: powershell
              run: |
                  $content = Get-Content "Source\pdxinfo"
                  $appVersion = ($content | Where-Object { $_ -match "^version=" }) -replace "^version=", ""
                  $artifactName = "CrankBoy-Simulator-$appVersion-windows-native"
                  echo "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

            # Step 9: Prepare Artifact for Upload
            - name: Prepare Artifact for Upload
              shell: powershell
              run: |
                  New-Item -ItemType Directory -Force -Path "artifact_root"
                  if (Test-Path "CrankBoy.pdx") {
                      Copy-Item -Recurse "CrankBoy.pdx" "artifact_root\"
                  } else {
                      Write-Warning "CrankBoy.pdx not found in expected location"
                      Get-ChildItem -Name "*.pdx" -Recurse | ForEach-Object {
                          Copy-Item -Recurse $_ "artifact_root\"
                      }
                  }

            # Step 10: Upload Windows Simulator Artifact
            - name: Upload Windows Simulator Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.artifact_details.outputs.artifact_name }}
                  path: artifact_root/