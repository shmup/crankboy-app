name: Windows Simulator Build

on:
    push:
        branches: [development, main]
    pull_request:
        branches: [development, main]

    workflow_dispatch:

jobs:
    build_simulator_windows:
        name: Create Windows Simulator Build
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  lfs: true

            - name: Setup MSYS2 MinGW64
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: >-
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-make
                      mingw-w64-x86_64-cmake
                      mingw-w64-x86_64-pkg-config
                      make
                      unzip
                      p7zip
                      curl
                      tar
                      git

            - name: Download and Setup Playdate SDK
              shell: msys2 {0}
              run: |
                  curl -L -o PlaydateSDK-2.7.6.exe "https://download.panic.com/playdate_sdk/Windows/PlaydateSDK-2.7.6.exe"
                  7z x PlaydateSDK-2.7.6.exe -oPlaydateSDK-extract -y
                  if [ -d "PlaydateSDK-extract/PlaydateSDK" ]; then
                      mv PlaydateSDK-extract/PlaydateSDK PlaydateSDK
                  elif [ -d "PlaydateSDK-extract/\$_OUTDIR" ]; then
                      mv "PlaydateSDK-extract/\$_OUTDIR" PlaydateSDK
                  elif [ -d "PlaydateSDK-extract" ]; then
                      mv PlaydateSDK-extract PlaydateSDK
                  else
                      echo "ERROR: Could not find SDK files after extraction"
                      find PlaydateSDK-extract -type d -maxdepth 2
                      exit 1
                  fi

                  if [ ! -d "PlaydateSDK/C_API" ]; then
                      echo "ERROR: C_API directory not found in SDK"
                      exit 1
                  fi

                  echo "PLAYDATE_SDK_PATH=$(pwd)/PlaydateSDK" >> $GITHUB_ENV

            - name: Prepare Lua Scripts
              run: |
                  mkdir -p Source/scripts
                  for file in src/scripts/*.lua; do
                      if [ -e "$file" ]; then
                          base=$(basename "$file" .lua)
                          cp "$file" "Source/scripts/${base}.l"
                      fi
                  done

            - name: Update Version and Build Number
              run: |
                  DATE_STAMP=$(date +'%Y%m%d')
                  CURRENT_VERSION=$(grep '^version=' Source/pdxinfo | cut -d '=' -f 2)
                  NEW_VERSION="${CURRENT_VERSION}.${DATE_STAMP}"
                  sed -i -e "s/^version=.*/version=$NEW_VERSION/" -e "s/^buildNumber=.*/buildNumber=$DATE_STAMP/" Source/pdxinfo

            - name: Build Simulator Project
              run: |
                  export PLAYDATE_SDK_PATH="$(pwd)/PlaydateSDK"
                  mkdir -p build
                  gcc -DTARGET_SIMULATOR=1 -DTARGET_EXTENSION=1 \
                      -I . -I "$PLAYDATE_SDK_PATH/C_API" -I src -I libs \
                      -I libs/minigb_apu -I libs/lz4 -I libs/lua-5.4.7 -I libs/pdnewlib \
                      -o build/pdex.exe \
                      src/cscripts/*.c src/*.c src/scenes/*.c \
                      libs/minigb_apu/minigb_apu.c libs/pdnewlib/pdnewlib.c main.c \
                      libs/lua-5.4.7/onelua.c libs/lz4/lz4.c \
                      "$PLAYDATE_SDK_PATH/C_API/buildsupport/setup.c"

            - name: Get Windows Simulator Artifact Name
              id: artifact_details
              shell: bash
              run: |
                  APP_VERSION=$(grep '^version=' Source/pdxinfo | cut -d '=' -f 2)
                  ARTIFACT_NAME="CrankBoy-Simulator-${APP_VERSION}-windows"
                  echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

            - name: Prepare Artifact for Upload
              run: |
                  mkdir -p artifact_root
                  cp build/pdex.exe artifact_root/CrankBoy-simulator.exe

            - name: Upload Windows Simulator Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.artifact_details.outputs.artifact_name }}
                  path: artifact_root/
