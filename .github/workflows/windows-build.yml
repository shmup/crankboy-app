name: Windows Simulator Build

on:
    push:
        branches: [development, main]
    pull_request:
        branches: [development, main]

    # Allows you to run this workflow manually from the Actions tab on GitHub.
    workflow_dispatch:

jobs:
    build_simulator_windows:
        name: Create Windows Simulator Build
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
            # Step 1: Check out the repository's code, submodules, and LFS files.
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  lfs: true

            # Step 2: Setup MSYS2 with MinGW64
            - name: Setup MSYS2 MinGW64
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: >-
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-make
                      mingw-w64-x86_64-cmake
                      mingw-w64-x86_64-pkg-config
                      make
                      unzip
                      p7zip
                      curl
                      tar
                      git

            # Step 3: Download and Setup Playdate SDK for Windows
            - name: Download and Setup Playdate SDK
              shell: msys2 {0}
              run: |
                  # Download Playdate SDK 2.7.6 for Windows
                  echo "Downloading Playdate SDK for Windows..."
                  curl -L -o PlaydateSDK-2.7.6.exe "https://download.panic.com/playdate_sdk/Windows/PlaydateSDK-2.7.6.exe"

                  # The Windows SDK is an NSIS installer, we need to extract it properly
                  echo "Extracting Playdate SDK installer..."
                  7z x PlaydateSDK-2.7.6.exe -oPlaydateSDK-extract -y

                  # The actual SDK files are usually in a subdirectory
                  # First, let's see what was extracted
                  echo "Checking extracted contents..."
                  ls -la PlaydateSDK-extract/

                  # Try to find the SDK directory - it might be directly extracted or in a subfolder
                  if [ -d "PlaydateSDK-extract/PlaydateSDK" ]; then
                      mv PlaydateSDK-extract/PlaydateSDK PlaydateSDK
                  elif [ -d "PlaydateSDK-extract/\$_OUTDIR" ]; then
                      # NSIS installers often extract to $_OUTDIR
                      mv "PlaydateSDK-extract/\$_OUTDIR" PlaydateSDK
                  elif [ -d "PlaydateSDK-extract" ]; then
                      # Maybe the files are directly in the extract folder
                      mv PlaydateSDK-extract PlaydateSDK
                  else
                      echo "ERROR: Could not find SDK files after extraction"
                      find PlaydateSDK-extract -type d -maxdepth 2
                      exit 1
                  fi

                  # Verify the SDK structure is correct
                  echo "Verifying SDK structure..."
                  if [ ! -d "PlaydateSDK/C_API" ]; then
                      echo "ERROR: C_API directory not found in SDK"
                      echo "SDK contents:"
                      ls -la PlaydateSDK/
                      exit 1
                  fi

                  # Set SDK path for the build
                  SDK_PATH="$(pwd)/PlaydateSDK"
                  echo "PLAYDATE_SDK_PATH=$SDK_PATH" >> $GITHUB_ENV

                  # Convert Windows path to MSYS2 path format for logging
                  SDK_PATH_MSYS=$(cygpath -u "$SDK_PATH")
                  echo "SDK installed at: $SDK_PATH_MSYS"

                  # Verify critical SDK components exist
                  echo "Checking for required SDK components..."
                  ls -la PlaydateSDK/C_API/buildsupport/ || echo "WARNING: buildsupport directory not found"
                  
                  # Check for important SDK tools and directories
                  echo "=== Full SDK structure ==="
                  find PlaydateSDK -type f -name "*.exe" | head -10
                  echo "=== SDK bin directory ==="
                  ls -la PlaydateSDK/bin/ || echo "No bin directory"
                  echo "=== Looking for lm or luac ==="
                  find PlaydateSDK -name "*lm*" -o -name "*luac*" -o -name "*.exe" | grep -E "(lm|luac)" || echo "No Lua compiler found"

            # Step 4: Prepare Lua scripts
            - name: Prepare Lua Scripts
              run: |
                  mkdir -p Source/scripts
                  for file in src/scripts/*.lua; do
                      if [ -e "$file" ]; then
                          base=$(basename "$file" .lua)
                          cp "$file" "Source/scripts/${base}.l"
                      fi
                  done

            # Step 5: Update Version and Build Number in pdxinfo
            - name: Update Version and Build Number
              run: |
                  DATE_STAMP=$(date +'%Y%m%d')
                  CURRENT_VERSION=$(grep '^version=' Source/pdxinfo | cut -d '=' -f 2)
                  NEW_VERSION="${CURRENT_VERSION}.${DATE_STAMP}"
                  echo "Updating version in Source/pdxinfo to $NEW_VERSION"
                  sed -i -e "s/^version=.*/version=$NEW_VERSION/" -e "s/^buildNumber=.*/buildNumber=$DATE_STAMP/" Source/pdxinfo
                  echo "Contents of pdxinfo after update:"
                  cat Source/pdxinfo

            # Step 6: Build the Project for Simulator
            - name: Build Simulator Project
              run: |
                  # Export SDK path for make
                  export PLAYDATE_SDK_PATH="$(pwd)/PlaydateSDK"
                  
                  # Add SDK bin directory to PATH
                  export PATH="$PLAYDATE_SDK_PATH/bin:$PATH"
                  
                  # Verify SDK tools are available
                  echo "Checking for SDK tools..."
                  ls -la "$PLAYDATE_SDK_PATH/bin/" || echo "No bin directory found"
                  
                  # Try to find and use the correct Lua compiler
                  if [ -f "$PLAYDATE_SDK_PATH/bin/lm.exe" ]; then
                      echo "Found lm.exe in SDK bin"
                  elif [ -f "$PLAYDATE_SDK_PATH/bin/luac.exe" ]; then
                      echo "Found luac.exe, creating lm symlink"
                      ln -s "$PLAYDATE_SDK_PATH/bin/luac.exe" "$PLAYDATE_SDK_PATH/bin/lm"
                  else
                      echo "No Lua compiler found, trying to use standard gcc for C compilation"
                      # Override the Lua compiler in the Makefile temporarily
                      export LM="gcc"
                  fi
                  
                  # Build using make for simulator target
                  echo "Building CrankBoy for Windows Simulator..."
                  make -j$(nproc) simulator || {
                      echo "Make failed, trying alternative build approach..."
                      
                      # Try building manually with gcc if make fails
                      echo "Attempting manual compilation..."
                      mkdir -p build
                      gcc -DTARGET_SIMULATOR=1 -DTARGET_EXTENSION=1 \
                          -I . -I "$PLAYDATE_SDK_PATH/C_API" -I src -I libs \
                          -I libs/minigb_apu -I libs/lz4 -I libs/lua-5.4.7 -I libs/pdnewlib \
                          -o build/pdex.exe \
                          src/cscripts/*.c src/*.c src/scenes/*.c \
                          libs/minigb_apu/minigb_apu.c libs/pdnewlib/pdnewlib.c main.c \
                          libs/lua-5.4.7/onelua.c libs/lz4/lz4.c \
                          "$PLAYDATE_SDK_PATH/C_API/buildsupport/setup.c" && \
                      echo "Manual build succeeded! Created build/pdex.exe" || \
                      echo "Manual build also failed"
                  }

            # Step 7: Get Windows Simulator Artifact Name
            - name: Get Windows Simulator Artifact Name
              id: artifact_details
              shell: bash
              run: |
                  APP_VERSION=$(grep '^version=' Source/pdxinfo | cut -d '=' -f 2)
                  ARTIFACT_NAME="CrankBoy-Simulator-${APP_VERSION}-windows"
                  echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

            # Step 8: Prepare Artifact for Upload
            - name: Prepare Artifact for Upload
              shell: bash
              run: |
                  mkdir -p artifact_root
                  
                  # Check what actually got built
                  echo "=== Checking build outputs ==="
                  ls -la build/ || echo "No build directory"
                  ls -la Source/ || echo "No Source directory"
                  find . -name "*.pdx*" -o -name "pdex*" | head -10
                  
                  # Look for different possible outputs
                  if [ -d "CrankBoy.pdx" ]; then
                      echo "Found CrankBoy.pdx directory"
                      cp -r CrankBoy.pdx artifact_root/
                  elif [ -f "build/pdex.exe" ]; then
                      echo "Found build/pdex.exe - copying as executable"
                      cp build/pdex.exe artifact_root/CrankBoy-simulator.exe
                  elif [ -f "build/pdex" ]; then
                      echo "Found build/pdex - copying as executable"
                      cp build/pdex artifact_root/CrankBoy-simulator
                  elif [ -f "Source/pdex.exe" ]; then
                      echo "Found Source/pdex.exe"
                      cp Source/pdex.exe artifact_root/CrankBoy-simulator.exe
                  else
                      echo "No recognizable build output found, uploading debug info"
                      echo "Build contents:" > artifact_root/build-debug.txt
                      find . -name "*pdx*" -o -name "*pdex*" -o -name "*.exe" | head -20 >> artifact_root/build-debug.txt
                      ls -la build/ >> artifact_root/build-debug.txt 2>/dev/null || true
                      ls -la Source/ >> artifact_root/build-debug.txt 2>/dev/null || true
                  fi

            # Step 9: Upload Windows Simulator Artifact
            - name: Upload Windows Simulator Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.artifact_details.outputs.artifact_name }}
                  path: artifact_root/
